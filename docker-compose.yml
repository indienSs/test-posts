version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: project-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - project-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./packages/server
      dockerfile: Dockerfile
      target: development  # Используем development стадию
    container_name: project-server
    restart: unless-stopped
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: appdb
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - ./packages/server:/app
      - /app/node_modules
    networks:
      - project-network
    depends_on:
      postgres:
        condition: service_healthy

  client:
    build:
      context: ./packages/client
      dockerfile: Dockerfile
      target: development
    container_name: project-client
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:3000/api
    ports:
      - "5173:5173"
    volumes:
      - ./packages/client:/app
      - /app/node_modules
    networks:
      - project-network
    depends_on:
      - server

networks:
  project-network:
    driver: bridge

volumes:
  postgres_data: